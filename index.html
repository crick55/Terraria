<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="-translucent">
    <title>Terraria</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon.jpg">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
    <style>
        :root {
            --bg-main: #000000;
            --bg-card: rgba(17, 17, 19, 0.55);
            --bg-elevated: rgba(28, 28, 31, 0.60);
            --border: rgba(255, 255, 255, 0.12);
            --text-main: #f2f2f7;
            --text-muted: #98989f;
            --accent: #8b5cf6;
            --accent-soft: rgba(139, 92, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            background-color: #000000;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            padding-bottom: 40px;
        }

        .bg-video {
            position: fixed;
            top: -12vh;
            left: 0;
            width: 100vw;
            height: 124lvh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.65);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: calc(12px + env(safe-area-inset-top)) 16px 8px 16px;
            border-bottom: 1px solid var(--border);
        }

        .header-top {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff6d6 0%, #f3c65f 55%, #b87e14 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(139, 92, 246, 0.55));
        }

        .search-bar {
            display: block;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 10px;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 6px;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: #c4b5fd;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        .section-banner {
            text-align: center;
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #f3c65f;
            background: rgba(17, 17, 19, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(243, 198, 95, 0.35);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 0 0 14px 0;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .tree-group {
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: var(--bg-card);
            overflow: hidden;
        }

        .tree-header {
            padding: 14px 16px;
            background-color: var(--bg-elevated);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .tree-header:active {
            background-color: #252529;
        }

        .tree-header span.count {
            font-size: 0.78rem;
            color: var(--text-muted);
            background: var(--bg-main);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .tree-content {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tree-group.collapsed .tree-content {
            display: none;
        }

        .simple-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 10px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .tree-content .item-card {
            background-color: var(--bg-main);
        }

        .item-card:active {
            border-color: var(--accent);
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            object-fit: cover;
            background-color: var(--bg-elevated);
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .avatar-placeholder {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            background-color: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--accent);
            font-size: 1.1rem;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .item-sub {
            font-size: 0.83rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: calc(12px + env(safe-area-inset-top)) 12px 12px 12px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-sheet {
            background: rgba(17, 17, 19, 0.94);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 720px;
            max-height: calc(100dvh - 24px);
            overflow-y: auto;
            padding: 20px;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.96); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-close {
            float: right;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        #detailModal.gallery-mode {
            align-items: center !important;
            justify-content: center !important;
        }

        .gal-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gal-prev { left: 10px; }
        .gal-next { right: 10px; }

        .modal-img {
            width: 100%;
            max-height: 460px;
            object-fit: contain;
            background-color: #000000;
            border-radius: 12px;
            margin: 12px 0;
            border: 1px solid var(--border);
        }

        .modal-tag {
            display: inline-block;
            background: var(--accent-soft);
            color: #c4b5fd;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .etat-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-left: 6px;
        }

        .etat-vivant {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
        }

        .etat-mort {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .modal-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .modal-section h4 {
            margin: 0 0 6px 0;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .modal-section p {
            margin: 0;
            font-size: 0.95rem;
            white-space: pre-line;
        }

        /* Styles du mode lecture Posts / Chapitres */
        .chapter-body {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .chapter-post {
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .chapter-author {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
        }

        .chapter-paragraph {
            margin: 0;
            font-size: 0.96rem;
            line-height: 1.68;
            white-space: pre-line;
        }

        /* Couleurs par auteur (prénom + texte) */
        .author-yann {
            color: #f87171; /* Rouge lumineux */
        }

        .author-brice {
            color: #4ade80; /* Vert */
        }

        .author-vio {
            color: #60a5fa; /* Bleu */
        }

        .author-default {
            color: var(--text-main);
        }

        .chapter-figure {
            margin: 6px 0;
            text-align: center;
        }

        .chapter-figure img,
        .chapter-figure video {
            width: 100%;
            max-height: 440px;
            object-fit: contain;
            background-color: #000000;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: block;
        }

        .chapter-caption {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 6px;
        }

        .chapter-nav {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .chapter-nav-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .chapter-nav-btn:active {
            border-color: var(--accent);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
        }

                /* Masquer la barre de défilement sur mobile tout en gardant le scroll */
        * {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* Edge / IE */
        }

        ::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Android */
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>
    <video class="bg-video" autoplay loop muted playsinline>
        <source src="images/lieux/GifTerraria.mp4" type="video/mp4">
    </video>
    <header>
        <div class="header-top">
            <h1 id="app-title">Terraria</h1>
        </div>
        <input type="text" id="searchInput" class="search-bar" placeholder="Rechercher un perso, un lieu, un chapitre...">
        <nav id="navTabs">
            <button class="tab-btn active" data-tab="personnages">Personnages</button>
            <button class="tab-btn" data-tab="lieux">Lieux</button>
            <button class="tab-btn" data-tab="faune">Faune</button>
            <button class="tab-btn" data-tab="galerie">Galerie</button>
            <button class="tab-btn" data-tab="histoire">Histoire</button>
        </nav>
    </header>

    <main id="contentArea"></main>

    <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="donnees.js"></script>
    <script src="chapitres.js"></script>
    <script>
        let currentTab = localStorage.getItem('terraria_active_tab') || 'personnages';
        let searchQuery = '';

        document.getElementById('app-title').textContent = CODEX_DATA.titre || 'Terraria';

        function setActiveTabButton(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === tabName);
            });
        }

        setActiveTabButton(currentTab);

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.dataset.tab;
                localStorage.setItem('terraria_active_tab', currentTab);
                setActiveTabButton(currentTab);
                render();
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            render();
        });

        function matchesSearch(item) {
            if (!searchQuery) return true;
            const text = Object.values(item).join(' ').toLowerCase();
            return text.includes(searchQuery);
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openItemModal(item);

            const visual = item.image
                ? `<img src="${item.image}" class="avatar" alt="${item.nom}">`
                : `<div class="avatar-placeholder">${item.nom.charAt(0).toUpperCase()}</div>`;

            let previewText = '';
            if (item.age && item.age !== 'À compléter') {
                previewText = item.age + (item.etat ? ' • ' + item.etat : '');
            } else if (item.etat) {
                previewText = item.etat;
            } else {
                previewText = item.sousTitre || item.description || '';
            }

            card.innerHTML = `
                ${visual}
                <div class="item-info">
                    <div class="item-title">${item.nom}</div>
                    <div class="item-sub">${previewText}</div>
                </div>
            `;
            return card;
        }

        function render() {
            const container = document.getElementById('contentArea');
            container.innerHTML = '';

            if (currentTab === 'galerie') {
                renderGalerie(container);
                return;
            }

            if (currentTab === 'histoire') {
                renderHistoire(container);
                return;
            }

            const items = (CODEX_DATA[currentTab] || []).filter(matchesSearch);

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucun élément trouvé.</div>';
                return;
            }

            if (currentTab === 'faune') {
                const listDiv = document.createElement('div');
                listDiv.className = 'simple-list';
                items.forEach(item => listDiv.appendChild(createCard(item)));
                container.appendChild(listDiv);
                return;
            }

            const groups = {};
            const groupOrder = [];
            items.forEach(item => {
                const cat = item.categorie || 'Général';
                if (!groups[cat]) {
                    groups[cat] = [];
                    groupOrder.push(cat);
                }
                groups[cat].push(item);
            });

            const isCollapsedByDefault = !searchQuery;

            groupOrder.forEach(cat => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'tree-group' + (isCollapsedByDefault ? ' collapsed' : '');

                const header = document.createElement('div');
                header.className = 'tree-header';
                const arrow = isCollapsedByDefault ? '▸ ' : '▾ ';
                header.innerHTML = `<span>${arrow}${cat}</span><span class="count">${groups[cat].length}</span>`;
                header.onclick = () => {
                    groupDiv.classList.toggle('collapsed');
                    header.querySelector('span').textContent = (groupDiv.classList.contains('collapsed') ? '▸ ' : '▾ ') + cat;
                };

                const content = document.createElement('div');
                content.className = 'tree-content';
                groups[cat].forEach(item => content.appendChild(createCard(item)));

                groupDiv.appendChild(header);
                groupDiv.appendChild(content);
                container.appendChild(groupDiv);
            });
        }

        function renderHistoire(container) {
            const banner = document.createElement('div');
            banner.className = 'section-banner';
            banner.textContent = "L'Histoire de Terraria";
            container.appendChild(banner);

            const allChapters = (typeof CHAPITRES_DATA !== 'undefined' ? CHAPITRES_DATA : []);
            const filtered = allChapters.filter(chap => {
                if (!searchQuery) return true;
                const fullText = [
                    chap.acte,
                    chap.titre,
                    chap.sousTitre || '',
                    ...(chap.contenu || []).map(b => (b.auteur || '') + ' ' + (b.texte || '') + ' ' + (b.legende || ''))
                ].join(' ').toLowerCase();
                return fullText.includes(searchQuery);
            });

            if (filtered.length === 0) {
                container.innerHTML += '<div class="empty-state">Aucun chapitre trouvé.</div>';
                return;
            }

            const acts = {};
            const actOrder = [];
            filtered.forEach(chap => {
                const actName = chap.acte || 'Récit';
                if (!acts[actName]) {
                    acts[actName] = [];
                    actOrder.push(actName);
                }
                acts[actName].push(chap);
            });

            const isCollapsedByDefault = !searchQuery;

            actOrder.forEach(actName => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'tree-group' + (isCollapsedByDefault ? ' collapsed' : '');

                const header = document.createElement('div');
                header.className = 'tree-header';
                const arrow = isCollapsedByDefault ? '▸ ' : '▾ ';
                header.innerHTML = `<span>${arrow}${actName}</span><span class="count">${acts[actName].length}</span>`;
                header.onclick = () => {
                    groupDiv.classList.toggle('collapsed');
                    header.querySelector('span').textContent = (groupDiv.classList.contains('collapsed') ? '▸ ' : '▾ ') + actName;
                };

                const content = document.createElement('div');
                content.className = 'tree-content';

                acts[actName].forEach(chap => {
                    const globalIndex = allChapters.indexOf(chap);
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.onclick = () => openChapterModal(globalIndex);

                    card.innerHTML = `
                        <div class="avatar-placeholder">${chap.numero || '#'}</div>
                        <div class="item-info">
                            <div class="item-title">Chapitre ${chap.numero} : ${chap.titre}</div>
                            <div class="item-sub">${chap.sousTitre || chap.acte}</div>
                        </div>
                    `;
                    content.appendChild(card);
                });

                groupDiv.appendChild(header);
                groupDiv.appendChild(content);
                container.appendChild(groupDiv);
            });
        }

        function getAuthorClass(auteur) {
            if (!auteur) return 'author-default';
            const clean = auteur.toLowerCase().trim();
            if (clean === 'yann') return 'author-yann';
            if (clean === 'brice') return 'author-brice';
            if (clean === 'vio' || clean === 'violaine') return 'author-vio';
            return 'author-default';
        }

        function openChapterModal(index) {
            const allChapters = (typeof CHAPITRES_DATA !== 'undefined' ? CHAPITRES_DATA : []);
            const chap = allChapters[index];
            if (!chap) return;

            const modal = document.getElementById('detailModal');
            const body = document.getElementById('modalBody');
            const sheet = modal.querySelector('.modal-sheet');
            modal.classList.remove('gallery-mode');

            let blocksHtml = '';
            (chap.contenu || []).forEach(block => {
                if (block.type === 'image') {
                    const mediaTag = block.src.endsWith('.mp4')
                        ? `<video src="${block.src}" controls loop playsinline></video>`
                        : `<img src="${block.src}" alt="${block.legende || chap.titre}">`;
                    blocksHtml += `
                        <div class="chapter-figure">
                            ${mediaTag}
                            ${block.legende ? `<div class="chapter-caption">${block.legende}</div>` : ''}
                        </div>
                    `;
                } else {
                    const colorClass = getAuthorClass(block.auteur);
                    blocksHtml += `
                        <div class="chapter-post">
                            ${block.auteur ? `<span class="chapter-author ${colorClass}">${block.auteur}</span>` : ''}
                            <p class="chapter-paragraph ${colorClass}">${block.texte || ''}</p>
                        </div>
                    `;
                }
            });

            const prevBtn = index > 0
                ? `<button class="chapter-nav-btn" onclick="openChapterModal(${index - 1})">← Précédent</button>`
                : `<span></span>`;
            const nextBtn = index < allChapters.length - 1
                ? `<button class="chapter-nav-btn" onclick="openChapterModal(${index + 1})">Suivant →</button>`
                : `<span></span>`;

            body.innerHTML = `
                <span class="modal-tag">${chap.acte} • Chapitre ${chap.numero}</span>
                <h2 style="margin: 4px 0 8px 0;">${chap.titre}</h2>
                <div class="chapter-body">
                    ${blocksHtml}
                </div>
                <div class="chapter-nav">
                    ${prevBtn}
                    ${nextBtn}
                </div>
            `;

            modal.classList.add('open');
            if (sheet) sheet.scrollTop = 0;
        }

        function renderGalerie(container) {
            const items = CODEX_DATA.galerie || [];
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucune image dans la galerie.</div>';
                return;
            }
            const grid = document.createElement('div');
            grid.style.cssText = 'display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;';

            items.forEach((src, index) => {
                const card = document.createElement('div');
                card.style.cssText = 'border-radius: 12px; overflow: hidden; aspect-ratio: 1 / 1; cursor: pointer; border: 1px solid var(--border); background: #000;';

                if (src.endsWith('.mp4')) {
                    card.innerHTML = `<video src="${src}" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>`;
                } else {
                    card.innerHTML = `<img src="${src}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block;">`;
                }

                card.onclick = () => openGalleryModal(index);
                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        function openItemModal(item) {
            const modal = document.getElementById('detailModal');
            const body = document.getElementById('modalBody');
            const sheet = modal.querySelector('.modal-sheet');
            modal.classList.remove('gallery-mode');

            let etatBadge = '';
            if (item.etat) {
                const isMort = item.etat.toLowerCase().includes('mort');
                etatBadge = `<span class="etat-badge ${isMort ? 'etat-mort' : 'etat-vivant'}">${item.etat}</span>`;
            }

            let html = `
                ${item.categorie ? `<span class="modal-tag">${item.categorie}</span>` : ''}
                ${etatBadge}
                <h2 style="margin: 4px 0 8px 0;">${item.nom}</h2>
                ${item.image ? `<img src="${item.image}" class="modal-img" alt="${item.nom}">` : ''}
            `;

            if (item.age) {
                html += `<div class="modal-section"><h4>Âge</h4><p>${item.age}</p></div>`;
            }
            if (item.descriptionPhysique) {
                html += `<div class="modal-section"><h4>Description physique</h4><p>${item.descriptionPhysique}</p></div>`;
            }
            if (item.aptitudes) {
                html += `<div class="modal-section"><h4>Aptitude(s)</h4><p>${item.aptitudes}</p></div>`;
            }
            if (item.description) {
                html += `<div class="modal-section"><h4>Description</h4><p>${item.description}</p></div>`;
            }
            if (item.infosComplementaires) {
                html += `<div class="modal-section"><h4>Informations complémentaires</h4><p>${item.infosComplementaires}</p></div>`;
            }
            if (item.details) {
                html += `<div class="modal-section"><h4>Particularités</h4><p>${item.details}</p></div>`;
            }

            body.innerHTML = html;
            modal.classList.add('open');
            if (sheet) sheet.scrollTop = 0;
        }

        let currentGalleryIndex = 0;

        function openGalleryModal(index) {
            const items = CODEX_DATA.galerie || [];
            if (!items.length) return;
            currentGalleryIndex = (index + items.length) % items.length;
            const src = items[currentGalleryIndex];

            const modal = document.getElementById('detailModal');
            const body = document.getElementById('modalBody');
            modal.classList.add('gallery-mode');

            const mediaHtml = src.endsWith('.mp4')
                ? `<video src="${src}" class="modal-img" style="max-height: 75vh; margin: 0;" controls autoplay loop playsinline></video>`
                : `<img src="${src}" class="modal-img" style="max-height: 75vh; margin: 0;">`;

            body.innerHTML = `
                <div style="position: relative; display: flex; align-items: center; justify-content: center;">
                    <button class="gal-nav-btn gal-prev" onclick="event.stopPropagation(); openGalleryModal(${currentGalleryIndex - 1})">&#10094;</button>
                    ${mediaHtml}
                    <button class="gal-nav-btn gal-next" onclick="event.stopPropagation(); openGalleryModal(${currentGalleryIndex + 1})">&#10095;</button>
                </div>
            `;
            modal.classList.add('open');
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.remove('open', 'gallery-mode');
            document.getElementById('modalBody').innerHTML = '';
        }

        render();
    </script>
</body>
</html>
