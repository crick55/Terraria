<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Terraria</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon.jpg">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
    <style>
        :root {
            --bg-main: #000000;
            --bg-card: rgba(17, 17, 19, 0.55);
            --bg-elevated: rgba(28, 28, 31, 0.60);
            --border: rgba(255, 255, 255, 0.12);
            --text-main: #f2f2f7;
            --text-muted: #98989f;
            --accent: #8b5cf6;
            --accent-soft: rgba(139, 92, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            background-color: #000000;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            padding-bottom: 40px;
        }

        .bg-video {
            position: fixed;
            top: -12vh;
            left: 0;
            width: 100vw;
            height: 124lvh;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.65);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: calc(12px + env(safe-area-inset-top)) 16px 8px 16px;
            border-bottom: 1px solid var(--border);
        }

        .header-top {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff6d6 0%, #f3c65f 55%, #b87e14 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(139, 92, 246, 0.55));
        }

        .search-bar {
            display: block;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 10px;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--accent);
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 6px;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: #c4b5fd;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        .section-banner {
            text-align: center;
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #f3c65f;
            background: rgba(17, 17, 19, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(243, 198, 95, 0.35);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 0 0 14px 0;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .tree-group {
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: var(--bg-card);
            overflow: hidden;
        }

        .tree-header {
            padding: 14px 16px;
            background-color: var(--bg-elevated);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .tree-header:active {
            background-color: #252529;
        }

        .tree-header span.count {
            font-size: 0.78rem;
            color: var(--text-muted);
            background: var(--bg-main);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .tree-content {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tree-group.collapsed .tree-content {
            display: none;
        }

        .simple-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 10px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .tree-content .item-card {
            background-color: var(--bg-main);
        }

        .item-card:active {
            border-color: var(--accent);
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            object-fit: cover;
            background-color: var(--bg-elevated);
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .avatar-placeholder {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            background-color: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--accent);
            font-size: 1.1rem;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .item-sub {
            font-size: 0.83rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: calc(12px + env(safe-area-inset-top)) 12px 12px 12px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-sheet {
            background: rgba(17, 17, 19, 0.94);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 720px;
            max-height: calc(100dvh - 24px);
            overflow-y: auto;
            padding: 20px;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.96); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            z-index: 20;
            background: rgba(28, 28, 31, 0.92);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .codex-ref {
            border-bottom: 1px dotted rgba(243, 198, 95, 0.75);
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .codex-ref:hover, .codex-ref:active {
            background-color: rgba(243, 198, 95, 0.18);
            border-radius: 3px;
        }

        .quick-card-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .quick-card-overlay.open {
            display: flex;
        }

        .quick-card-box {
            background: rgba(22, 22, 26, 0.98);
            border: 1px solid rgba(243, 198, 95, 0.45);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            max-height: 75dvh;
            overflow-y: auto;
            padding: 18px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
            animation: popIn 0.16s ease-out;
        }

        #detailModal.gallery-mode {
            align-items: center !important;
            justify-content: center !important;
        }

        .gal-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gal-prev { left: 10px; }
        .gal-next { right: 10px; }

        .modal-img {
            width: 100%;
            max-height: 460px;
            object-fit: contain;
            background-color: #000000;
            border-radius: 12px;
            margin: 12px 0;
            border: 1px solid var(--border);
        }

        .modal-tag {
            display: inline-block;
            background: var(--accent-soft);
            color: #c4b5fd;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .etat-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-left: 6px;
        }

        .etat-vivant {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
        }

        .etat-mort {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        .modal-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .modal-section h4 {
            margin: 0 0 6px 0;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .modal-section p {
            margin: 0;
            font-size: 0.95rem;
            white-space: pre-line;
        }

        .apparition-link {
            display: inline-block;
            margin-top: 6px;
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            color: #c4b5fd;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
        }

        .apparition-link:active {
            opacity: 0.8;
        }

        /* Styles du mode lecture Posts / Chapitres */
        .chapter-body {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .chapter-post {
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.4s ease;
        }

        .chapter-post.highlight-post {
            border-color: #f3c65f;
            box-shadow: 0 0 14px rgba(243, 198, 95, 0.35);
        }

        .chapter-author {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
        }

        .chapter-paragraph {
            margin: 0;
            font-size: 0.96rem;
            line-height: 1.68;
            white-space: pre-line;
        }

        /* Couleurs par auteur (prénom + texte) */
        .author-yann {
            color: #f87171; /* Rouge lumineux */
        }

        .author-brice {
            color: #4ade80; /* Vert */
        }

        .author-vio {
            color: #60a5fa; /* Bleu */
        }

        .author-default {
            color: var(--text-main);
        }

        .chapter-figure {
            margin: 6px 0;
            text-align: center;
        }

        .chapter-figure img,
        .chapter-figure video {
            width: 100%;
            max-height: 440px;
            object-fit: contain;
            background-color: #000000;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: block;
        }

        .chapter-caption {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 6px;
        }

        .chapter-nav {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .chapter-nav-btn {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .chapter-nav-btn:active {
            border-color: var(--accent);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
        }

        /* Masquer la barre de défilement sur mobile tout en gardant le scroll */
        * {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* Edge / IE */
        }

        ::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Android */
            width: 0;
            height: 0;
        }
    </style>
</head>

<div class="quick-card-overlay" id="quickCardModal" onclick="closeQuickCard()">

<script src="chapitres.js"></script>

<!-- Acte I -->
<script src="chapitres/acte1/ch0_prologue.js"></script>
<script src="chapitres/acte1/ch1_arrivee_terraria.js"></script>
<script src="chapitres/acte1/ch2_tour_nuage.js"></script>
<script src="chapitres/acte1/ch3_royaume_glaces.js"></script>
<script src="chapitres/acte1/ch4_esprit_timio.js"></script>
<script src="chapitres/acte1/ch5_grand_maitre.js"></script>
<script src="chapitres/acte1/ch6_coeur_thayri.js"></script>

<!-- Acte II -->
<script src="chapitres/acte2/ch1_fetes_annonces.js"></script>
<script src="chapitres/acte2/ch2_observatoire.js"></script>
<script src="chapitres/acte2/ch3_domaine_asher.js"></script>
   <script>
        let currentTab = localStorage.getItem('terraria_active_tab') || 'personnages';
        let searchQuery = '';

        document.getElementById('app-title').textContent = CODEX_DATA.titre || 'Terraria';

        function normalizeText(str) {
            return String(str || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');
        }

        // Index des mots-clés cliquables du Codex (personnages, lieux, faune, objets)
        const CODEX_INDEX = [];
        (function buildCodexIndex() {
            const categories = ['personnages', 'lieux', 'faune', 'objets'];
            const seenTerms = new Set();

            categories.forEach(cat => {
                (CODEX_DATA[cat] || []).forEach(item => {
                    if (!item.nom || item.nom.toLowerCase().startsWith('completer')) return;

                    const aliases = new Set([item.nom]);
                    // Gérer les noms composés comme "Celestine (dit Celes)", "Liam/Timio", "Codex (4 fragments)"
                    const baseName = item.nom.replace(/\s*\([^)]*\)/g, '').trim();
                    if (baseName.length >= 4) aliases.add(baseName);

                    if (baseName.includes('/')) {
                        baseName.split('/').forEach(part => {
                            if (part.trim().length >= 4) aliases.add(part.trim());
                        });
                    }

                    const ditMatch = item.nom.match(/\(dit\s+([^)]+)\)/i);
                    if (ditMatch && ditMatch[1].trim().length >= 4) {
                        aliases.add(ditMatch[1].trim());
                    }

                    if (item.nom === 'Le Grand Maître') aliases.add('Grand Maître');

                    aliases.forEach(term => {
                        const key = term.toLowerCase();
                        if (!seenTerms.has(key) && term.length >= 4) {
                            seenTerms.add(key);
                            CODEX_INDEX.push({ term, item });
                        }
                    });
                });
            });

            // Trier du plus long au plus court pour éviter les collisions partielles
            CODEX_INDEX.sort((a, b) => b.term.length - a.term.length);
        })();

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Rend les noms du Codex cliquables dans un texte (en excluant la fiche courante)
        function linkifyCodexTerms(text, excludeItemName) {
            if (!text || CODEX_INDEX.length === 0) return text || '';

            const activeEntries = CODEX_INDEX.filter(entry => entry.item.nom !== excludeItemName);
            if (activeEntries.length === 0) return text;

            const pattern = new RegExp(
                `(?<![\\p{L}\\p{N}])(${activeEntries.map(e => escapeRegExp(e.term)).join('|')})(?![\\p{L}\\p{N}])`,
                'giu'
            );

            return text.replace(pattern, (matched) => {
                const found = activeEntries.find(e => e.term.toLowerCase() === matched.toLowerCase());
                if (!found) return matched;
                const safeNom = found.item.nom.replace(/'/g, "\\'");
                return `<span class="codex-ref" onclick="event.stopPropagation(); openQuickCardByName('${safeNom}')">${matched}</span>`;
            });
        }

        function openQuickCardByName(nom) {
            const categories = ['personnages', 'lieux', 'faune', 'objets'];
            let foundItem = null;
            for (const cat of categories) {
                foundItem = (CODEX_DATA[cat] || []).find(i => i.nom === nom);
                if (foundItem) break;
            }
            if (!foundItem) return;

            const overlay = document.getElementById('quickCardModal');
            const body = document.getElementById('quickCardBody');

            let etatBadge = '';
            if (foundItem.etat) {
                const isMort = foundItem.etat.toLowerCase().includes('mort');
                etatBadge = `<span class="etat-badge ${isMort ? 'etat-mort' : 'etat-vivant'}">${foundItem.etat}</span>`;
            }

            const resume = foundItem.descriptionPhysique || foundItem.description || foundItem.sousTitre || '';
            const infos = foundItem.infosComplementaires || foundItem.details || '';
            const safeNom = foundItem.nom.replace(/'/g, "\\'");

            body.innerHTML = `
                ${foundItem.categorie ? `<span class="modal-tag">${foundItem.categorie}</span>` : ''}
                ${etatBadge}
                <h3 style="margin: 4px 0 8px 0; font-size: 1.2rem;">${foundItem.nom}</h3>
                ${foundItem.image ? `<img src="${foundItem.image}" class="modal-img" style="max-height: 220px;" alt="${foundItem.nom}">` : ''}
                ${foundItem.age && foundItem.age !== 'À compléter' ? `<p style="font-size: 0.85rem; color: var(--text-muted); margin: 4px 0 8px 0;">Âge : ${foundItem.age}</p>` : ''}
                ${resume ? `<p style="font-size: 0.92rem; margin: 0 0 8px 0;">${resume}</p>` : ''}
                ${infos ? `<p style="font-size: 0.88rem; color: var(--text-muted); margin: 0 0 12px 0;">${infos}</p>` : ''}
                <button class="apparition-link" onclick="closeQuickCard(); openFullCardByName('${safeNom}')">
                    Ouvrir la fiche complète →
                </button>
            `;

            overlay.classList.add('open');
        }

        function openFullCardByName(nom) {
            const categories = ['personnages', 'lieux', 'faune', 'objets'];
            for (const cat of categories) {
                const found = (CODEX_DATA[cat] || []).find(i => i.nom === nom);
                if (found) {
                    openItemModal(found);
                    return;
                }
            }
        }

        function closeQuickCard() {
            document.getElementById('quickCardModal').classList.remove('open');
            document.getElementById('quickCardBody').innerHTML = '';
        }

        function setActiveTabButton(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === tabName);
            });
        }

        setActiveTabButton(currentTab);

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentTab = btn.dataset.tab;
                localStorage.setItem('terraria_active_tab', currentTab);
                setActiveTabButton(currentTab);
                if (searchQuery) {
                    searchQuery = '';
                    document.getElementById('searchInput').value = '';
                }
                render();
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = normalizeText(e.target.value.trim());
            render();
        });

        function matchesSearch(item) {
            if (!searchQuery) return true;
            const text = normalizeText(
                Object.values(item)
                    .map(v => (typeof v === 'object' && v !== null) ? Object.values(v).join(' ') : v)
                    .join(' ')
            );
            return text.includes(searchQuery);
        }

        function createCard(item, badgeLabel) {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openItemModal(item);

            const visual = item.image
                ? `<img src="${item.image}" class="avatar" alt="${item.nom}">`
                : `<div class="avatar-placeholder">${item.nom.charAt(0).toUpperCase()}</div>`;

            let previewText = '';
            if (badgeLabel) {
                previewText = badgeLabel + (item.sousTitre ? ' • ' + item.sousTitre : '');
            } else if (item.age && item.age !== 'À compléter') {
                previewText = item.age + (item.etat ? ' • ' + item.etat : '');
            } else if (item.etat) {
                previewText = item.etat;
            } else {
                previewText = item.sousTitre || item.description || '';
            }

            card.innerHTML = `
                ${visual}
                <div class="item-info">
                    <div class="item-title">${item.nom}</div>
                    <div class="item-sub">${previewText}</div>
                </div>
            `;
            return card;
        }

        function buildSnippet(text, query) {
            const norm = normalizeText(text);
            const idx = norm.indexOf(query);
            if (idx === -1) return text.slice(0, 90) + (text.length > 90 ? '…' : '');
            const start = Math.max(0, idx - 30);
            const end = Math.min(text.length, idx + query.length + 55);
            return (start > 0 ? '…' : '') + text.slice(start, end).trim() + (end < text.length ? '…' : '');
        }

        function renderGlobalSearch(container) {
            const banner = document.createElement('div');
            banner.className = 'section-banner';
            banner.textContent = `Résultats de recherche`;
            container.appendChild(banner);

            const sections = [
                { key: 'personnages', label: 'Personnages' },
                { key: 'lieux', label: 'Lieux' },
                { key: 'faune', label: 'Faune' },
                { key: 'objets', label: 'Objets & Artefacts' }
            ];

            let totalCount = 0;

            sections.forEach(sec => {
                const matches = (CODEX_DATA[sec.key] || []).filter(matchesSearch);
                if (matches.length === 0) return;
                totalCount += matches.length;

                const groupDiv = document.createElement('div');
                groupDiv.className = 'tree-group';

                const header = document.createElement('div');
                header.className = 'tree-header';
                header.innerHTML = `<span>▾ ${sec.label}</span><span class="count">${matches.length}</span>`;
                header.onclick = () => {
                    groupDiv.classList.toggle('collapsed');
                    header.querySelector('span').textContent = (groupDiv.classList.contains('collapsed') ? '▸ ' : '▾ ') + sec.label;
                };

                const content = document.createElement('div');
                content.className = 'tree-content';
                matches.forEach(item => content.appendChild(createCard(item, item.categorie || sec.label)));

                groupDiv.appendChild(header);
                groupDiv.appendChild(content);
                container.appendChild(groupDiv);
            });

            const allChapters = (typeof CHAPITRES_DATA !== 'undefined' ? CHAPITRES_DATA : []);
            const storyHits = [];

            allChapters.forEach((chap, chapIndex) => {
                const titleMatch = normalizeText(`${chap.titre} ${chap.sousTitre || ''}`).includes(searchQuery);
                let chapterAdded = false;

                (chap.contenu || []).forEach((block, blockIndex) => {
                    if (block.type === 'image') return;
                    const textMatch = normalizeText(`${block.auteur || ''} ${block.texte || ''}`).includes(searchQuery);
                    if (textMatch) {
                        storyHits.push({
                            chapIndex,
                            chap,
                            blockIndex,
                            auteur: block.auteur,
                            extrait: buildSnippet(block.texte || '', searchQuery)
                        });
                        chapterAdded = true;
                    }
                });

                if (titleMatch && !chapterAdded) {
                    storyHits.push({
                        chapIndex,
                        chap,
                        blockIndex: null,
                        auteur: null,
                        extrait: chap.sousTitre || chap.acte
                    });
                }
            });

            if (storyHits.length > 0) {
                totalCount += storyHits.length;

                const groupDiv = document.createElement('div');
                groupDiv.className = 'tree-group';

                const header = document.createElement('div');
                header.className = 'tree-header';
                header.innerHTML = `<span>▾ Histoire (Chapitres & Passages)</span><span class="count">${storyHits.length}</span>`;
                header.onclick = () => {
                    groupDiv.classList.toggle('collapsed');
                    header.querySelector('span').textContent = (groupDiv.classList.contains('collapsed') ? '▸ ' : '▾ ') + 'Histoire (Chapitres & Passages)';
                };

                const content = document.createElement('div');
                content.className = 'tree-content';

                storyHits.forEach(hit => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.onclick = () => {
                        openChapterModal(hit.chapIndex);
                        if (hit.blockIndex !== null) {
                            setTimeout(() => {
                                const target = document.getElementById(`post-${hit.blockIndex}`);
                                if (target) {
                                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    target.classList.add('highlight-post');
                                    setTimeout(() => target.classList.remove('highlight-post'), 2500);
                                }
                            }, 100);
                        }
                    };

                    const chapLabel = hit.chap.numero === 0 ? 'Prologue' : `Chapitre ${hit.chap.numero}`;
                    const authorPrefix = hit.auteur ? `${hit.auteur} : ` : '';

                    card.innerHTML = `
                        <div class="avatar-placeholder">${hit.chap.numero}</div>
                        <div class="item-info">
                            <div class="item-title">${chapLabel} — ${hit.chap.titre}</div>
                            <div class="item-sub">${authorPrefix}${hit.extrait}</div>
                        </div>
                    `;
                    content.appendChild(card);
                });

                groupDiv.appendChild(header);
                groupDiv.appendChild(content);
                container.appendChild(groupDiv);
            }

            if (totalCount === 0) {
                container.innerHTML += '<div class="empty-state">Aucun résultat dans le codex ni dans l’histoire.</div>';
            }
        }

        function render() {
            const container = document.getElementById('contentArea');
            container.innerHTML = '';

            if (searchQuery) {
                renderGlobalSearch(container);
                return;
            }

            if (currentTab === 'galerie') {
                renderGalerie(container);
                return;
            }

            if (currentTab === 'histoire') {
                renderHistoire(container);
                return;
            }

            const items = CODEX_DATA[currentTab] || [];

            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucun élément trouvé.</div>';
                return;
            }

            if (currentTab === 'faune') {
                const listDiv = document.createElement('div');
                listDiv.className = 'simple-list';
                items.forEach(item => listDiv.appendChild(createCard(item)));
                container.appendChild(listDiv);
                return;
            }

            const groups = {};
            const groupOrder = [];
            items.forEach(item => {
                const cat = item.categorie || 'Général';
                if (!groups[cat]) {
                    groups[cat] = [];
                    groupOrder.push(cat);
                }
                groups[cat].push(item);
            });

            groupOrder.forEach(cat => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'tree-group collapsed';

                const header = document.createElement('div');
                header.className = 'tree-header';
                header.innerHTML = `<span>▸ ${cat}</span><span class="count">${groups[cat].length}</span>`;
                header.onclick = () => {
                    groupDiv.classList.toggle('collapsed');
                    header.querySelector('span').textContent = (groupDiv.classList.contains('collapsed') ? '▸ ' : '▾ ') + cat;
                };

                const content = document.createElement('div');
                content.className = 'tree-content';
                groups[cat].forEach(item => content.appendChild(createCard(item)));

                groupDiv.appendChild(header);
                groupDiv.appendChild(content);
                container.appendChild(groupDiv);
            });
        }

        function renderHistoire(container) {
            const banner = document.createElement('div');
            banner.className = 'section-banner';
            banner.textContent = "L'Histoire de Terraria";
            container.appendChild(banner);

            const allChapters = (typeof CHAPITRES_DATA !== 'undefined' ? CHAPITRES_DATA : []);

            if (allChapters.length === 0) {
                container.innerHTML += '<div class="empty-state">Aucun chapitre trouvé.</div>';
                return;
            }

            const acts = {};
            const actOrder = [];
            allChapters.forEach(chap => {
                const actName = chap.acte || 'Récit';
                if (!acts[actName]) {
                    acts[actName] = [];
                    actOrder.push(actName);
                }
                acts[actName].push(chap);
            });

            actOrder.forEach(actName => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'tree-group collapsed';

                const header = document.createElement('div');
                header.className = 'tree-header';
                header.innerHTML = `<span>▸ ${actName}</span><span class="count">${acts[actName].length}</span>`;
                header.onclick = () => {
                    groupDiv.classList.toggle('collapsed');
                    header.querySelector('span').textContent = (groupDiv.classList.contains('collapsed') ? '▸ ' : '▾ ') + actName;
                };

                const content = document.createElement('div');
                content.className = 'tree-content';

                acts[actName].forEach(chap => {
                    const globalIndex = allChapters.indexOf(chap);
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.onclick = () => openChapterModal(globalIndex);

                    card.innerHTML = `
                        <div class="avatar-placeholder">${chap.numero || '#'}</div>
                        <div class="item-info">
                            <div class="item-title">Chapitre ${chap.numero} : ${chap.titre}</div>
                            <div class="item-sub">${chap.sousTitre || chap.acte}</div>
                        </div>
                    `;
                    content.appendChild(card);
                });

                groupDiv.appendChild(header);
                groupDiv.appendChild(content);
                container.appendChild(groupDiv);
            });
        }

        function getAuthorClass(auteur) {
            if (!auteur) return 'author-default';
            const clean = auteur.toLowerCase().trim();
            if (clean === 'yann') return 'author-yann';
            if (clean === 'brice') return 'author-brice';
            if (clean === 'vio' || clean === 'violaine') return 'author-vio';
            return 'author-default';
        }

        function goToApparition(chapNumero, texteRecherche) {
            const allChapters = (typeof CHAPITRES_DATA !== 'undefined' ? CHAPITRES_DATA : []);
            const chapIndex = allChapters.findIndex(c => c.numero === chapNumero);
            if (chapIndex === -1) return;

            openChapterModal(chapIndex);

            if (texteRecherche) {
                const chap = allChapters[chapIndex];
                const postIndex = (chap.contenu || []).findIndex(b =>
                    normalizeText(b.texte || '').includes(normalizeText(texteRecherche))
                );
                if (postIndex !== -1) {
                    setTimeout(() => {
                        const target = document.getElementById(`post-${postIndex}`);
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            target.classList.add('highlight-post');
                            setTimeout(() => target.classList.remove('highlight-post'), 2500);
                        }
                    }, 100);
                }
            }
        }

        function openChapterModal(index) {
            const allChapters = (typeof CHAPITRES_DATA !== 'undefined' ? CHAPITRES_DATA : []);
            const chap = allChapters[index];
            if (!chap) return;

            const modal = document.getElementById('detailModal');
            const body = document.getElementById('modalBody');
            const sheet = modal.querySelector('.modal-sheet');
            modal.classList.remove('gallery-mode');

            let blocksHtml = '';
            (chap.contenu || []).forEach((block, blockIndex) => {
                if (block.type === 'image') {
                    const mediaTag = block.src.endsWith('.mp4')
                        ? `<video src="${block.src}" controls loop playsinline></video>`
                        : `<img src="${block.src}" alt="${block.legende || chap.titre}">`;
                    blocksHtml += `
                        <div class="chapter-figure">
                            ${mediaTag}
                            ${block.legende ? `<div class="chapter-caption">${block.legende}</div>` : ''}
                        </div>
                    `;
                } else {
                    const colorClass = getAuthorClass(block.auteur);
                    const linkedText = linkifyCodexTerms(block.texte || '', null);
                    blocksHtml += `
                        <div class="chapter-post" id="post-${blockIndex}">
                            ${block.auteur ? `<span class="chapter-author ${colorClass}">${block.auteur}</span>` : ''}
                            <p class="chapter-paragraph ${colorClass}">${linkedText}</p>
                        </div>
                    `;
                }
            });

            const prevBtn = index > 0
                ? `<button class="chapter-nav-btn" onclick="openChapterModal(${index - 1})">← Précédent</button>`
                : `<span></span>`;
            const nextBtn = index < allChapters.length - 1
                ? `<button class="chapter-nav-btn" onclick="openChapterModal(${index + 1})">Suivant →</button>`
                : `<span></span>`;

            body.innerHTML = `
                <span class="modal-tag">${chap.acte} • Chapitre ${chap.numero}</span>
                <h2 style="margin: 4px 0 8px 0;">${chap.titre}</h2>
                <div class="chapter-body">
                    ${blocksHtml}
                </div>
                <div class="chapter-nav">
                    ${prevBtn}
                    ${nextBtn}
                </div>
            `;

            modal.classList.add('open');
            if (sheet) sheet.scrollTop = 0;
        }

        function renderGalerie(container) {
            const items = CODEX_DATA.galerie || [];
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">Aucune image dans la galerie.</div>';
                return;
            }
            const grid = document.createElement('div');
            grid.style.cssText = 'display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;';

            items.forEach((src, index) => {
                const card = document.createElement('div');
                card.style.cssText = 'border-radius: 12px; overflow: hidden; aspect-ratio: 1 / 1; cursor: pointer; border: 1px solid var(--border); background: #000;';

                if (src.endsWith('.mp4')) {
                    card.innerHTML = `<video src="${src}" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>`;
                } else {
                    card.innerHTML = `<img src="${src}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; display: block;">`;
                }

                card.onclick = () => openGalleryModal(index);
                grid.appendChild(card);
            });

            container.appendChild(grid);
        }

        function openItemModal(item) {
            const modal = document.getElementById('detailModal');
            const body = document.getElementById('modalBody');
            const sheet = modal.querySelector('.modal-sheet');
            modal.classList.remove('gallery-mode');

            let etatBadge = '';
            if (item.etat) {
                const isMort = item.etat.toLowerCase().includes('mort');
                etatBadge = `<span class="etat-badge ${isMort ? 'etat-mort' : 'etat-vivant'}">${item.etat}</span>`;
            }

            let html = `
                ${item.categorie ? `<span class="modal-tag">${item.categorie}</span>` : ''}
                ${etatBadge}
                <h2 style="margin: 4px 0 8px 0;">${item.nom}</h2>
                ${item.image ? `<img src="${item.image}" class="modal-img" alt="${item.nom}">` : ''}
            `;

            if (item.age) {
                html += `<div class="modal-section"><h4>Âge</h4><p>${item.age}</p></div>`;
            }
            if (item.descriptionPhysique) {
                html += `<div class="modal-section"><h4>Description physique</h4><p>${linkifyCodexTerms(item.descriptionPhysique, item.nom)}</p></div>`;
            }
            if (item.aptitudes) {
                html += `<div class="modal-section"><h4>Aptitude(s)</h4><p>${linkifyCodexTerms(item.aptitudes, item.nom)}</p></div>`;
            }
            if (item.description) {
                html += `<div class="modal-section"><h4>Description</h4><p>${linkifyCodexTerms(item.description, item.nom)}</p></div>`;
            }
            if (item.infosComplementaires) {
                html += `<div class="modal-section"><h4>Informations complémentaires</h4><p>${linkifyCodexTerms(item.infosComplementaires, item.nom)}</p></div>`;
            }
            if (item.details) {
                html += `<div class="modal-section"><h4>Particularités</h4><p>${linkifyCodexTerms(item.details, item.nom)}</p></div>`;
            }
            if (item.apparition) {
                const labelChap = item.apparition.chapitre === 0
                    ? 'Prologue'
                    : `Chapitre ${item.apparition.chapitre}`;
                const texteRecherche = (item.apparition.recherche || '').replace(/'/g, "\\'");
                html += `
                    <div class="modal-section">
                        <h4>Première apparition</h4>
                        <button class="apparition-link" onclick="goToApparition(${item.apparition.chapitre}, '${texteRecherche}')">
                            📖 Lire dans le ${labelChap} →
                        </button>
                    </div>
                `;
            }

            body.innerHTML = html;
            modal.classList.add('open');
            if (sheet) sheet.scrollTop = 0;
        }

        let currentGalleryIndex = 0;

        function openGalleryModal(index) {
            const items = CODEX_DATA.galerie || [];
            if (!items.length) return;
            currentGalleryIndex = (index + items.length) % items.length;
            const src = items[currentGalleryIndex];

            const modal = document.getElementById('detailModal');
            const body = document.getElementById('modalBody');
            modal.classList.add('gallery-mode');

            const mediaHtml = src.endsWith('.mp4')
                ? `<video src="${src}" class="modal-img" style="max-height: 75vh; margin: 0;" controls autoplay loop playsinline></video>`
                : `<img src="${src}" class="modal-img" style="max-height: 75vh; margin: 0;">`;

            body.innerHTML = `
                <div style="position: relative; display: flex; align-items: center; justify-content: center;">
                    <button class="gal-nav-btn gal-prev" onclick="event.stopPropagation(); openGalleryModal(${currentGalleryIndex - 1})">&#10094;</button>
                    ${mediaHtml}
                    <button class="gal-nav-btn gal-next" onclick="event.stopPropagation(); openGalleryModal(${currentGalleryIndex + 1})">&#10095;</button>
                </div>
            `;
            modal.classList.add('open');
        }

        function closeModal() {
            closeQuickCard();
            const modal = document.getElementById('detailModal');
            modal.classList.remove('open', 'gallery-mode');
            document.getElementById('modalBody').innerHTML = '';
        }

        render();
    </script>
</body>
</html>
